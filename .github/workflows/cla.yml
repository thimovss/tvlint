# Asks contributors to sign CLA.md on their first pull request and records who has signed.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      # pull_request_target runs with write access, so this job never checks out the pull request's code.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Kept off main so signing works while main is protected.
          branch: cla-signatures
          allowlist: github-actions[bot],dependabot[bot]
