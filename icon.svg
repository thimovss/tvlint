<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">TVLint</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- outer hexagon: the boundary the rules enforce -->
  <polygon points="64,7 113.5,35.5 113.5,92.5 64,121 14.5,92.5 14.5,35.5"
           fill="none" stroke="url(#g)" stroke-width="10" stroke-linejoin="round"/>

  <!-- inner hexagon: the code that passes -->
  <polygon points="64,30 93.5,47 93.5,81 64,98 34.5,81 34.5,47"
           fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>

  <path d="M51 64.5 l9.5 9.5 l17 -19" fill="none" stroke="#ffffff" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
