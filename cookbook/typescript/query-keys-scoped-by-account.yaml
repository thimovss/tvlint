# Query keys start with the tenant or account id
# Cached data is per account. A key that does not start with the account id can show one
# account's cached data to another after the user switches. Only array literals are checked,
# so keys built by a helper function (queryKey: keyFor(accountID)) are not flagged.
# Exclude the few queries that are global on purpose.

rules:
  query-keys-scoped-by-account:
    language: [javascript, typescript]
    property_value:
      names: queryKey
      array_starts_with: accountID
    rationale: Cached data belongs to one account. A key without the account id can serve it to another account.
    fix: 'Start the key with the account id, e.g. queryKey: [accountID, "contracts", id].'

scopes:
  - rules: [query-keys-scoped-by-account]
    include: ["src/**"]
